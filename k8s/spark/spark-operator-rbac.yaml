apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-operator-full-role
  namespace: spark
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "endpoints", "events", "persistentvolumeclaims"]
  verbs: ["*"]
- apiGroups: ["sparkoperator.k8s.io"]
  resources: ["sparkapplications", "scheduledsparkapplications", "sparkapplications/status", "sparkconnects"]
  verbs: ["*"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-operator-full-binding
  namespace: spark
subjects:
- kind: ServiceAccount
  name: spark-operator-controller
  namespace: spark
roleRef:
  kind: Role
  name: spark-operator-full-role
  apiGroup: rbac.authorization.k8s.io