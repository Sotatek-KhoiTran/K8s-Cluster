---
# 1. ConfigMap: The hive-site.xml configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: default
data:
  hive-site.xml: |
    <configuration>
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:postgresql://host.docker.internal:5433/metastore_db</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionDriverName</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionUserName</name>
        <value>hiveuser</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionPassword</name>
        <value>hivepassword</value>
      </property>
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://0.0.0.0:9083</value>
      </property>
      <property>
        <name>hive.metastore.schema.verification</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.gs.impl</name>
        <value>com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem</value>
      </property>
      <property>
        <name>google.cloud.auth.service.account.enable</name>
        <value>true</value>
      </property>
      <property>
        <name>google.cloud.auth.service.account.json.keyfile</name>
        <value>/opt/hive/keys/key.json</value>
      </property>
    </configuration>

---
# 2. Deployment: The Init Container and the HMS Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      # 1. Add a shared volume for the JAR
      volumes:
        - name: hive-lib-ext
          emptyDir: {}
        - name: hive-config
          configMap:
            name: hive-metastore-config
        - name: hive-gcp-key
          secret:
            secretName: hive-gcp-key  

      initContainers:
        # 2. Add an init container to download the JAR (matching your Spark version)
        - name: fetch-gcs-jar
          image: curlimages/curl
          command: ["/bin/sh", "-c"]
          args: 
            - curl -L https://repo1.maven.org/maven2/com/google/cloud/bigdataoss/gcs-connector/hadoop3-2.2.14/gcs-connector-hadoop3-2.2.14-shaded.jar -o /ext-lib/gcs-connector.jar
          volumeMounts:
            - name: hive-lib-ext
              mountPath: /ext-lib
              
        - name: init-metastore-schema
          image: apache/hive:3.1.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              /opt/hive/bin/schematool -dbType postgres -info || \
              /opt/hive/bin/schematool -dbType postgres -initSchema
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
      
      containers:
        - name: metastore
          image: apache/hive:3.1.3
          command: ["/opt/hive/bin/hive"]
          args: ["--service", "metastore"]
          ports:
            - containerPort: 9083
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: hive-lib-ext
              mountPath: /opt/hive/lib/gcs-connector.jar
              subPath: gcs-connector.jar
            - name: hive-gcp-key
              mountPath: /opt/hive/keys/key.json
              subPath: key.json


---
# 3. Service: Exposing HMS to Spark/Airflow pods
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      targetPort: 9083
      protocol: TCP