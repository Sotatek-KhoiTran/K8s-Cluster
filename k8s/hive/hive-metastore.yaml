---
# 1. ConfigMap: The hive-site.xml configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  namespace: default
data:
  hive-site.xml: |
    <configuration>
      <property>
        <name>javax.jdo.option.ConnectionURL</name>
        <value>jdbc:postgresql://host.docker.internal:5433/metastore_db</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionDriverName</name>
        <value>org.postgresql.Driver</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionUserName</name>
        <value>hiveuser</value>
      </property>
      <property>
        <name>javax.jdo.option.ConnectionPassword</name>
        <value>hivepassword</value>
      </property>
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://0.0.0.0:9083</value>
      </property>
      <property>
        <name>hive.metastore.schema.verification</name>
        <value>false</value>
      </property>
    </configuration>

---
# 2. Deployment: The Init Container and the HMS Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      # InitContainer: Formats the empty Postgres DB with Hive tables before HMS starts
      initContainers:
        - name: init-metastore-schema
          # Using a standard image that includes the Postgres JDBC driver
          image: apache/hive:3.1.3
          command: ["/opt/hive/bin/schematool"]
          args: ["-dbType", "postgres", "-initSchema"]
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
      
      # Main Container: Starts the Thrift Server
      containers:
        - name: metastore
          image: apache/hive:3.1.3
          command: ["/opt/hive/bin/hive"]
          args: ["--service", "metastore"]
          ports:
            - containerPort: 9083
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
      
      volumes:
        - name: hive-config
          configMap:
            name: hive-metastore-config

---
# 3. Service: Exposing HMS to Spark/Airflow pods
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      targetPort: 9083
      protocol: TCP